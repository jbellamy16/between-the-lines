name: Verify Between the Lines
on:
  push:
    branches: [main, "feat/**", "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      AI_ENABLED: "false"
      REDIS_TEST_URL: redis://127.0.0.1:6379
      RECORDED_MATCHES_VISIBLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation
          path: |
            artifacts/director-evaluation.json
            artifacts/intelligence-evaluation.json
            artifacts/broadcast-story.json
            artifacts/ai-evaluation.json
            artifacts/historical-evaluation.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            artifacts/
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: https://second-look.sybgm6dkhk.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run cloudflare:build
      - run: npx wrangler deploy --dry-run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.cloudflare.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cloudflare-failure-evidence
          path: |
            test-results/
            artifacts/
